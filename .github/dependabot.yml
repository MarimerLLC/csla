version: 2
updates:
- package-ecosystem: nuget
  directory: "/Source"
  schedule:
    interval: daily
    time: "11:00"
  open-pull-requests-limit: 10
  ignore:
  - dependency-name: EntityFramework
    versions:
    - "< 6, >= 5.a"
  # The analyzers, code fixes and generators bundled in the Csla package are
  # built against these packages. The compiler won't load an analyzer or
  # generator built against a newer Roslyn than itself (CS9057), so their
  # version is the minimum compiler CSLA consumers need. It has to stay low
  # enough for the .NET 10 SDK and for VS 2022 (.NET Framework 4.6.2
  # developers). Raise it by hand, deliberately, never through Dependabot.
  - dependency-name: Microsoft.CodeAnalysis.Common
  - dependency-name: Microsoft.CodeAnalysis.CSharp
  - dependency-name: Microsoft.CodeAnalysis.CSharp.Workspaces
  # Each target framework references the Microsoft.Extensions major version
  # that matches it (10.x for net10.0, 11.x for net11.0) and the .NET
  # Framework and netstandard2.0 targets keep a low floor, because a library's
  # dependency version is a minimum for its consumers. Major versions change
  # by hand, along with the target frameworks; patch and minor updates still
  # come through.
  - dependency-name: Microsoft.Extensions.*
    update-types:
    - version-update:semver-major
  # Same for MAUI: the net10.0 targets of Csla.Xaml.Maui use MAUI 10 and the
  # net11.0 targets use MAUI 11.
  - dependency-name: Microsoft.Maui.*
    update-types:
    - version-update:semver-major
  - dependency-name: Microsoft.EntityFrameworkCore
    versions:
    - ">= 3.a, < 4"
  - dependency-name: Newtonsoft.Json
    versions:
    - ">= 10.a, < 11"
  - dependency-name: Newtonsoft.Json
    versions:
    - ">= 11.a, < 12"
  - dependency-name: Newtonsoft.Json
    versions:
    - ">= 12.a, < 13"
  - dependency-name: NuGet.CommandLine
    versions:
    - "< 5, >= 4.a"
  - dependency-name: Microsoft.EntityFrameworkCore
    versions:
    - 5.0.3
    - 5.0.4
    - 5.0.5
  - dependency-name: Microsoft.AspNetCore.Components.Web
    versions:
    - 5.0.3
    - 5.0.4
    - 5.0.5
  - dependency-name: Microsoft.AspNetCore.Components
    versions:
    - 5.0.3
    - 5.0.4
    - 5.0.5
  - dependency-name: Microsoft.Extensions.Logging.EventSource
    versions:
    - 5.0.1
  - dependency-name: Microsoft.Extensions.Primitives
    versions:
    - 5.0.1
  - dependency-name: Microsoft.AspNetCore.Components.WebAssembly
    versions:
    - 5.0.3
    - 5.0.4
    - 5.0.5
  - dependency-name: Microsoft.AspNetCore.Components.Authorization
    versions:
    - 5.0.3
    - 5.0.4
    - 5.0.5
  - dependency-name: Newtonsoft.Json
    versions:
    - 13.0.1
  - dependency-name: MSTest.TestAdapter
    versions:
    - 2.2.2
  - dependency-name: System.Text.Encodings.Web
    versions:
    - 5.0.1
  - dependency-name: Grpc.Tools
    versions:
    - 2.36.0
  - dependency-name: System.Diagnostics.EventLog
    versions:
    - 5.0.1
