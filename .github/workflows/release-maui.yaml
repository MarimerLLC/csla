name: release-maui

# trigger on a push to any release-maui/* branch
on:
  push:
    branches:
      - 'release-maui/*'

jobs:

  build:

    runs-on: windows-latest

    # The nuget-release environment only allows release-maui/* branches and requires
    # approval; the nuget.org trusted publishing policy requires this environment.
    environment: nuget-release

    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        global-json-file: Source/global.json

    - name: Install .NET MAUI workloads
      run: dotnet workload install maui

    - name: Build and Pack
      run: dotnet pack Source\csla.maui.build.sln --configuration Release -p:PublicRelease=true

    # Exchange the GitHub OIDC token for a short-lived (1 hour) nuget.org API key.
    # Requires a trusted publishing policy on nuget.org for this workflow file.
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: rockfordlhotka

    - name: Push NuGet packages
      run: dotnet nuget push bin\packages-maui\*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
